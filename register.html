<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pak eduTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }</style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-8">
                <a href="index.html" class="text-3xl">🎓</a>
                <h1 class="text-3xl font-bold gradient-bg bg-clip-text text-transparent mt-2">Join Pak eduTool</h1>
                <p class="text-gray-600 mt-2">Start your learning journey today</p>
            </div>
            
            <form id="registerForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">I want to</label>
                    <select id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                        <option value="student">Learn as Student</option>
                        <option value="instructor">Teach as Instructor</option>
                    </select>
                </div>
                <button type="submit" class="w-full gradient-bg text-white py-2 rounded-lg font-semibold hover:opacity-90 transition">
                    Sign Up
                </button>
            </form>
            
            <p class="text-center text-gray-600 mt-4">
                Already have an account? <a href="login.html" class="text-purple-600 hover:underline">Login</a>
            </p>
            <p class="text-center text-gray-400 text-sm mt-4">
                <a href="../../index.html" class="hover:underline">← Back to Home</a>
            </p>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const btn = e.target.querySelector('button[type="submit"]');

            btn.disabled = true;
            btn.textContent = 'Creating account…';

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role }),
                    signal: controller.signal
                });
                clearTimeout(timer);

                let data;
                try { data = await res.json(); } catch { data = {}; }

                if (res.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'login.html';
                } else {
                    throw new Error(data.error || `Registration failed (${res.status})`);
                }
            } catch (err) {
                clearTimeout(timer);
                const msg = err.name === 'AbortError'
                    ? 'Request timed out — the server may be starting up. Please try again.'
                    : err.message || 'Registration failed. Check your connection.';
                console.error('[Register]', err);
                alert(msg);
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        });
    </script>
</body>
</html>
